name: Supabase Keepalive

# Pings Supabase REST API daily to prevent Free Tier 7-day idle pause.
# Replaces the local macOS LaunchAgent (which only fires when the Mac is awake).
#
# Setup:
#   1. GitHub repo Settings → Secrets and variables → Actions → New repository secret
#      - SUPABASE_URL       (e.g. https://xxxx.supabase.co)
#      - SUPABASE_ANON_KEY  (sb_publishable_... or anon key)
#   2. Failures show as a red X in Actions tab and trigger GitHub notification email.

on:
  schedule:
    # Twice daily (UTC). 03:00 UTC = 12:00 KST, 15:00 UTC = 00:00 KST.
    # Two pings keeps the idle counter well below the 7-day pause threshold even if one run fails.
    - cron: '0 3,15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret not set"
            exit 1
          fi
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            --max-time 15 \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${code}"
          # 2xx = healthy. 401/403 also counts as "DB reachable" (auth issue, not idle pause).
          case "${code}" in
            2*|401|403) exit 0 ;;
            *) echo "::error::Unexpected status ${code}"; head -c 500 /tmp/body; exit 1 ;;
          esac
